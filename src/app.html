<!doctype html>
<html lang="en" data-theme="pro">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-150x150.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#0d968b" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="DTSS" />
		<!-- Dark mode is removed. Synchronously strip any leftover `dark` class and
		     clear mode-watcher's persisted preference (localStorage key 'mode') so
		     users previously stuck in dark mode are healed on their next load,
		     before anything renders. -->
		<script>
			try {
				document.documentElement.classList.remove('dark');
				localStorage.removeItem('mode');
			} catch (e) {
				/* no-op */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
